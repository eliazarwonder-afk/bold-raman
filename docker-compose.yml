version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: pulsequeue-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data

  worker-1:
    build: .
    container_name: pulsequeue-worker-1
    command: ["worker", "--broker", "redis://redis:6379/0", "--queue", "default", "--concurrency", "8"]
    depends_on:
      redis:
        condition: service_healthy
    restart: on-failure

  worker-2:
    build: .
    container_name: pulsequeue-worker-2
    command: ["worker", "--broker", "redis://redis:6379/0", "--queue", "default", "--concurrency", "8"]
    depends_on:
      redis:
        condition: service_healthy
    restart: on-failure

volumes:
  redis-data:
